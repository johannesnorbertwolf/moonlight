# Xcode project for the Moonlight iPhone app. Generate with: xcodegen generate
name: Moonlight
options:
  bundleIdPrefix: nl.moonlight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8XRKL83C4V
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Moonlight:
    type: application
    platform: iOS
    sources:
      - Moonlight
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.moonlight.app
        CODE_SIGN_ENTITLEMENTS: Moonlight/Moonlight.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Moonlight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Moonlight/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: nl.moonlight.app.invite
            CFBundleURLSchemes: [moonlight]
    dependencies:
      - target: MoonlightMonitor
  MoonlightMonitor:
    type: app-extension
    platform: iOS
    sources:
      - MonitorExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.moonlight.app.monitor
        CODE_SIGN_ENTITLEMENTS: MonitorExtension/MonitorExtension.entitlements
        INFOPLIST_FILE: MonitorExtension/Info.plist
